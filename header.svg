<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 190" width="880" height="190" role="img" aria-label="Matheus Henrique de Faria — Desenvolvedor Full-Stack. React, Next.js, Node.js, TypeScript.">
  <style>
    @media (prefers-reduced-motion: reduce) { .pkt { display: none; } .pulse { display: none; } }
  </style>

  <rect x="0.5" y="0.5" width="879" height="189" rx="12" fill="#0d1117" stroke="#21262d"/>
  <rect x="40" y="34" width="46" height="2" rx="1" fill="#e8a33d"/>

  <!-- identity -->
  <text x="40" y="62" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" letter-spacing="2.4" fill="#8b949e">FULL-STACK DEVELOPER</text>
  <text x="40" y="104" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#e6edf3">Matheus Henrique de Faria</text>
  <text x="40" y="130" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#8b949e">React 18 · Next.js 14 · Node.js · TypeScript</text>
  <text x="40" y="152" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" letter-spacing="0.6" fill="#57606a">Joinville, SC — Brasil</text>

  <!-- pipeline -->
  <g>
    <line x1="592" y1="86" x2="668" y2="86" stroke="#21262d" stroke-width="1.5"/>
    <line x1="712" y1="86" x2="788" y2="86" stroke="#21262d" stroke-width="1.5"/>

    <text x="630" y="70" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8.5" letter-spacing="0.8" fill="#57606a">socket.io</text>
    <text x="750" y="70" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8.5" letter-spacing="0.8" fill="#57606a">prisma</text>

    <!-- nodes -->
    <g>
      <rect x="548" y="64" width="44" height="44" rx="10" fill="#161b22" stroke="#30363d"/>
      <text x="570" y="91" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700" fill="#e8a33d">UI</text>
      <text x="570" y="128" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8.5" letter-spacing="1.2" fill="#57606a">CLIENT</text>
    </g>
    <g>
      <rect x="668" y="64" width="44" height="44" rx="10" fill="#161b22" stroke="#30363d"/>
      <rect class="pulse" x="668" y="64" width="44" height="44" rx="10" fill="none" stroke="#e8a33d" stroke-width="1.5">
        <animate attributeName="opacity" values="0.55;0;0.55" keyTimes="0;0.6;1" dur="2.6s" repeatCount="indefinite"/>
        <animate attributeName="x" values="668;660;668" keyTimes="0;0.6;1" dur="2.6s" repeatCount="indefinite"/>
        <animate attributeName="y" values="64;56;64" keyTimes="0;0.6;1" dur="2.6s" repeatCount="indefinite"/>
        <animate attributeName="width" values="44;60;44" keyTimes="0;0.6;1" dur="2.6s" repeatCount="indefinite"/>
        <animate attributeName="height" values="44;60;44" keyTimes="0;0.6;1" dur="2.6s" repeatCount="indefinite"/>
      </rect>
      <text x="690" y="91" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700" fill="#e8a33d">API</text>
      <text x="690" y="128" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8.5" letter-spacing="1.2" fill="#57606a">NODE</text>
    </g>
    <g>
      <rect x="788" y="64" width="44" height="44" rx="10" fill="#161b22" stroke="#30363d"/>
      <text x="810" y="91" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700" fill="#5b9dd9">DB</text>
      <text x="810" y="128" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8.5" letter-spacing="1.2" fill="#57606a">POSTGRES</text>
    </g>

    <!-- packets -->
    <g class="pkt">
      <circle r="3" fill="#e8a33d">
        <animateMotion dur="1.8s" repeatCount="indefinite" calcMode="spline" keyPoints="0;1" keyTimes="0;1" keySplines="0.33 0 0.15 1" path="M592,86 L668,86"/>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.18;0.82;1" dur="1.8s" repeatCount="indefinite"/>
      </circle>
      <circle r="3" fill="#e8a33d">
        <animateMotion dur="1.8s" begin="0.75s" repeatCount="indefinite" calcMode="spline" keyPoints="0;1" keyTimes="0;1" keySplines="0.33 0 0.15 1" path="M712,86 L788,86"/>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.18;0.82;1" dur="1.8s" begin="0.75s" repeatCount="indefinite"/>
      </circle>
      <circle r="2.4" fill="#5b9dd9">
        <animateMotion dur="1.8s" begin="1.2s" repeatCount="indefinite" calcMode="spline" keyPoints="0;1" keyTimes="0;1" keySplines="0.33 0 0.15 1" path="M788,86 L712,86"/>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.18;0.82;1" dur="1.8s" begin="1.2s" repeatCount="indefinite"/>
      </circle>
      <circle r="2.4" fill="#5b9dd9">
        <animateMotion dur="1.8s" begin="1.95s" repeatCount="indefinite" calcMode="spline" keyPoints="0;1" keyTimes="0;1" keySplines="0.33 0 0.15 1" path="M668,86 L592,86"/>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.18;0.82;1" dur="1.8s" begin="1.95s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>
</svg>
